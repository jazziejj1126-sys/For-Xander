<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Letters for Xander ♡</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #f8f1e7;
      color: #4b3832;
      line-height: 1.7;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    /* =========================
       COVER
    ========================= */

    .cover {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    .cover h1 {
      font-size: 42px;
      font-weight: normal;
      margin-bottom: 15px;
    }

    .cover p {
      font-size: 17px;
      color: #765c50;
      margin-bottom: 30px;
    }

    .open-button {
      border: none;
      background: #6f4e45;
      color: white;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 16px;
      transition: 0.3s;
    }

    .open-button:hover {
      background: #5c4039;
      transform: scale(1.05);
    }

    /* =========================
       COLLECTION
    ========================= */

    .collection {
      display: none;
      min-height: 100vh;
      max-width: 1000px;
      margin: auto;
      padding: 50px 20px;
    }

    .collection h1 {
      text-align: center;
      font-size: 36px;
      font-weight: normal;
      margin-bottom: 10px;
    }

    .collection-subtitle {
      text-align: center;
      color: #765c50;
      margin-bottom: 40px;
    }

    .letters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }

    .letter-card {
      width: 100%;
      border: 1px solid #d8c5b8;
      background: #fffaf4;
      color: #4b3832;
      padding: 25px;
      border-radius: 15px;
      text-align: left;
      transition: 0.3s;
    }

    .letter-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(75, 56, 50, 0.12);
    }

    .letter-card span {
      display: block;
      color: #a27b6d;
      font-size: 12px;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .letter-card strong {
      font-size: 17px;
      font-weight: normal;
    }

    /* =========================
       READER
    ========================= */

    .reader {
      display: none;
      min-height: 100vh;
      max-width: 800px;
      margin: auto;
      padding: 30px 20px 60px;
    }

    .back {
      border: none;
      background: transparent;
      color: #765c50;
      font-size: 15px;
      margin-bottom: 25px;
    }

    .paper {
      background: #fffaf4;
      padding: 45px;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(75, 56, 50, 0.1);
    }

    .letter-number {
      color: #a27b6d;
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .paper h2 {
      font-size: 30px;
      font-weight: normal;
      line-height: 1.3;
      margin-bottom: 30px;
    }

    #letterContent p {
      margin-bottom: 20px;
    }

    .navigation {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
    }

    .navigation button {
      border: none;
      background: #6f4e45;
      color: white;
      padding: 12px 20px;
      border-radius: 25px;
      font-size: 14px;
    }

    .navigation button:hover {
      background: #5c4039;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .cover h1 {
        font-size: 32px;
      }

      .cover p {
        font-size: 15px;
      }

      .collection h1 {
        font-size: 30px;
      }

      .letters-grid {
        grid-template-columns: 1fr;
      }

      .paper {
        padding: 25px;
      }

      .paper h2 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       COVER
  ========================= -->

  <section class="cover" id="home">

    <h1>letters i never knew to say</h1>

    <p>
      For Xander, with all the words I couldn't always say out loud. ♡
    </p>

    <button class="open-button" onclick="openLetters()">
      Open your letters ♡
    </button>

  </section>


  <!-- =========================
       LETTER COLLECTION
  ========================= -->

  <section class="collection" id="letters">

    <h1>Letters for You ♡</h1>

    <p class="collection-subtitle">
      Twenty letters, written just for you.
    </p>

    <div class="letters-grid">

      <button class="letter-card" onclick="openLetter(1)">
        <span>LETTER 01</span>
        <strong>Before I Knew You</strong>
      </button>

      <button class="letter-card" onclick="openLetter(2)">
        <span>LETTER 02</span>
        <strong>That Random Night on Live</strong>
      </button>

      <button class="letter-card" onclick="openLetter(3)">
        <span>LETTER 03</span>
        <strong>I Think I Got Attached Too Fast</strong>
      </button>

      <button class="letter-card" onclick="openLetter(4)">
        <span>LETTER 04</span>
        <strong>The Things I Notice About You</strong>
      </button>

      <button class="letter-card" onclick="openLetter(5)">
        <span>LETTER 05</span>
        <strong>Do You Know How Attractive Your Mind Is?</strong>
      </button>

      <button class="letter-card" onclick="openLetter(6)">
        <span>LETTER 06</span>
        <strong>The Quiet Calls</strong>
      </button>

      <button class="letter-card" onclick="openLetter(7)">
        <span>LETTER 07</span>
        <strong>You Didn't Create My Spark</strong>
      </button>

      <button class="letter-card" onclick="openLetter(8)">
        <span>LETTER 08</span>
        <strong>Are You Out of My League?</strong>
      </button>

      <button class="letter-card" onclick="openLetter(9)">
        <span>LETTER 09</span>
        <strong>Do You Like Me as a Whole?</strong>
      </button>

      <button class="letter-card" onclick="openLetter(10)">
        <span>LETTER 10</span>
        <strong>We Were Both Scared of the Same Thing</strong>
      </button>

      <button class="letter-card" onclick="openLetter(11)">
        <span>LETTER 11</span>
        <strong>There Are Things About Me I Still Don't Know How to Tell You</strong>
      </button>

      <button class="letter-card" onclick="openLetter(12)">
        <span>LETTER 12</span>
        <strong>The Girl Before You</strong>
      </button>

      <button class="letter-card" onclick="openLetter(13)">
        <span>LETTER 13</span>
        <strong>When You Go Quiet</strong>
      </button>

      <button class="letter-card" onclick="openLetter(14)">
        <span>LETTER 14</span>
        <strong>I Can't Carry Everything For You</strong>
      </button>

      <button class="letter-card" onclick="openLetter(15)">
        <span>LETTER 15</span>
        <strong>Please Don't Be Mean to Yourself Because of Me</strong>
      </button>

      <button class="letter-card" onclick="openLetter(16)">
        <span>LETTER 16</span>
        <strong>The Quiz I Didn't Study For</strong>
      </button>

      <button class="letter-card" onclick="openLetter(17)">
        <span>LETTER 17</span>
        <strong>Sorry I Went Quiet</strong>
      </button>

      <button class="letter-card" onclick="openLetter(18)">
        <span>LETTER 18</span>
        <strong>Us, Doing Our Own Things Together</strong>
      </button>

      <button class="letter-card" onclick="openLetter(19)">
        <span>LETTER 19</span>
        <strong>I Don't Know What We'll Become</strong>
      </button>

      <button class="letter-card" onclick="openLetter(20)">
        <span>LETTER 20</span>
        <strong>Okay, It's Your Birthday. Here's Everything I Couldn't Say Properly.</strong>
      </button>

    </div>

  </section>


  <!-- =========================
       LETTER READER
  ========================= -->

  <section class="reader" id="reader">

    <button class="back" onclick="closeLetter()">
      ← Back to collection
    </button>

    <div class="paper">

      <p class="letter-number" id="letterNumber">
        LETTER 01
      </p>

      <h2 id="letterTitle">
        Before I Knew You
      </h2>

      <div id="letterContent">
        <p>Your letter will appear here.</p>
      </div>

    </div>

    <div class="navigation">

      <button onclick="previousLetter()">
        ← Previous
      </button>

      <button onclick="nextLetter()">
        Next →
      </button>

    </div>

  </section>


  <!-- =========================
       SCRIPT
  ========================= -->

  <script src="./script.js?v=3"></script>

</body>
</html>
