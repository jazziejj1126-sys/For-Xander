<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Letters for You ♡</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- COVER -->

    <section class="cover" id="home">

        <p class="small-title">a little corner of my heart</p>

        <h1>
            For<br>
            My Dearest<br>
            Jhan Xander
        </h1>

        <p class="dedication">
            somethings are easier to write than to say out loud, so i put them here,<br>
            one letter at a time.
        </p>

        <button onclick="openLetters()">
            Open your letters ♡
        </button>

    </section>


    <!-- FOR XANDER -->

    <section class="collection" id="letters">

        <p class="small-title">THE COLLECTION</p>

        <h2>Letters I want you to have</h2>

        <div class="letters-grid">

            <button onclick="openLetter(1)">
                <span>01</span>
                <strong>Before I Knew You</strong>
                <small>How I admired you even before you knew I existed.</small>
            </button>

            <button onclick="openLetter(2)">
                <span>02</span>
                <strong>That Random Night on Live</strong>
                <small>The unexpected night that somehow brought us together.</small>
            </button>

            <button onclick="openLetter(3)">
                <span>03</span>
                <strong>I Think I Got Attached Too Fast</strong>
                <small>When you became important, quickly.</small>
            </button>

            <button onclick="openLetter(4)">
                <span>04</span>
                <strong>The THings I Notice About You</strong>
                <small>the little things i adore</small>
            </button>

            <button onclick="openLetter(5)">
                <span>05</span>
                <strong>Do You Know How Attractive Your Mind Is?</strong>
                <small>your mind is beautiful.</small>
            </button>

            <button onclick="openLetter(6)">
                <span>06</span>
                <strong>The Quiet Calls</strong>
                <small>Your presence feels enough</small>
            </button>

            <button onclick="openLetter(7)">
                <span>07</span>
                <strong>You Didn't Create My Spark</strong>
                <small>you reminded me of who I was.</small>
            </button>

            <button onclick="openLetter(8)">
                <span>08</span>
                <strong>Are you out of my league?</strong>
                <small>wondering if im enough.</small>
            </button>

            <button onclick="openLetter(9)">
                <span>09</span>
                <strong>Do You Like Me as a Whole?</strong>
                <small>loving you beyond the surface.</small>
            </button>

            <button onclick="openLetter(10)">
                <span>10</span>
                <strong>We Were Both Scared of the Same Thing</strong>
                <small>two hearts, one fear</small>
            </button>

            <button onclick="openLetter(11)">
                <span>11</span>
                <strong>There Are Things About Me I Still Don't Know How to Tell you</strong>
                <small>The truths im still learning to share.</small>
            </button>

            <button onclick="openLetter(12)">
                <span>12</span>
                <strong>The Girl Before You</strong>
                <small>who i was before</small>
            </button>

            <button onclick="openLetter(13)">
    <span>13</span>
    <strong>When You Go Quiet</strong>
    <small>the silence that makes me worry</small>
</button>

<button onclick="openLetter(14)">
    <span>14</span>
    <strong>I Can't Carry Everything For You</strong>
    <small>loving without losing myself.</small>
</button>

<button onclick="openLetter(15)">
    <span>15</span>
    <strong>Please Don't Be Mean to Yourself Because of Me</strong>
    <small>please be gentle with yourself.</small>
</button>

<button onclick="openLetter(16)">
    <span>16</span>
    <strong>The Quiz I Didn't Study For</strong>
    <small>when i disappointed myself.</small>
</button>

<button onclick="openLetter(17)">
    <span>17</span>
    <strong>Sorry I Went Quiet</strong>
    <small>when i needed to breathe.</small>
</button>

<button onclick="openLetter(18)">
    <span>18</span>
    <strong>Us, Doing Our Own Things Together</strong>
    <small>together, even in silence.</small>
</button>

<button onclick="openLetter(19)">
    <span>19</span>
    <strong>I Don't Know What We'll Become</strong>
    <small>uncertain, but hopeful.</small>
</button>

<button onclick="openLetter(20)">
    <span>20</span>
    <strong>Okay, It's Your Birthday. Here's Everything I Couldn't Say Properly</strong>
    <small>Everything my heart couldn't say.</small>
</button>

        </div>

        <div class="navigation">
            <button onclick="previousLetter()">← Previous</button>
            <button onclick="nextLetter()">Next →</button>
        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
