<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Letters for You ♡</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f0ea;
    color: #302923;
    font-family: Georgia, "Times New Roman", serif;
}

button {
    font-family: inherit;
}

/* COVER */

.cover {
    min-height: 100vh;
    padding: 120px 44px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.small-title {
    letter-spacing: 6px;
    font-size: 11px;
    color: #918981;
    margin-bottom: 45px;
}

.cover h1 {
    font-size: clamp(48px, 12vw, 90px);
    line-height: 0.95;
    font-weight: 400;
    margin: 0 0 35px;
}

.dedication {
    color: #746c65;
    line-height: 1.8;
    font-size: 14px;
}

.cover button {
    margin-top: 40px;
    width: fit-content;
    padding: 16px 25px;
    border: 1px solid #302923;
    background: transparent;
    color: #302923;
    cursor: pointer;
    font-size: 14px;
}

.cover button:hover {
    background: #302923;
    color: white;
}


/* COLLECTION */

.collection {
    display: none;
    padding: 100px 44px;
}

.collection h2 {
    font-size: clamp(45px, 10vw, 75px);
    font-weight: 400;
    line-height: 1;
    margin: 0 0 80px;
    max-width: 800px;
}

.letters-grid {
    max-width: 900px;
}

.letters-grid button {
    width: 100%;
    display: block;
    text-align: left;
    border: 0;
    border-bottom: 1px solid #6e665f;
    background: transparent;
    padding: 45px 60px;
    cursor: pointer;
    color: #302923;
}

.letters-grid button:first-child {
    background: #302923;
    color: #f5f0ea;
}

.letters-grid button:hover {
    background: #302923;
    color: #f5f0ea;
}

.letters-grid span {
    display: block;
    font-size: 13px;
    margin-bottom: 35px;
    opacity: .7;
}

.letters-grid strong {
    display: block;
    font-size: 27px;
    font-weight: 400;
    margin-bottom: 12px;
}

.letters-grid small {
    font-size: 14px;
    font-style: italic;
    opacity: .7;
}


/* READER */

.reader {
    display: none;
    min-height: 100vh;
    padding: 50px 25px 80px;
}

.back {
    border: 0;
    background: transparent;
    cursor: pointer;
    color: #706860;
    font-size: 14px;
    margin-bottom: 50px;
}

.paper {
    max-width: 750px;
    margin: auto;
    background: #fffdf9;
    padding: 60px 35px;
    box-shadow: 0 10px 40px rgba(0,0,0,.06);
}

.letter-number {
    font-size: 11px;
    letter-spacing: 4px;
    color: #968d84;
    margin-bottom: 30px;
}

.paper h2 {
    font-size: clamp(35px, 8vw, 55px);
    font-weight: 400;
    line-height: 1.05;
    margin-bottom: 50px;
}

#letterContent {
    font-size: 17px;
    line-height: 1.9;
    color: #4a423c;
}

#letterContent p {
    margin-bottom: 25px;
}

.navigation {
    max-width: 750px;
    margin: 30px auto;
    display: flex;
    justify-content: space-between;
}

.navigation button {
    background: transparent;
    border: 0;
    cursor: pointer;
    font-size: 14px;
    color: #5f5750;
}

</style>
</head>


<body>


<!-- ================= COVER ================= -->

<section class="cover" id="home">

    <p class="small-title">
        A LITTLE CORNER OF MY HEART
    </p>

    <h1>
        For<br>
        My Dearest<br>
        Jhan Xander
    </h1>

    <p class="dedication">
        somethings are easier to write than to say out loud,<br>
        so i put them here, one letter at a time.
    </p>

    <button id="openCollection">
        Open your letters ♡
    </button>

</section>



<!-- ================= COLLECTION ================= -->

<section class="collection" id="collection">

    <p class="small-title">
        THE COLLECTION
    </p>

    <h2>
        Letters I want you to have
    </h2>

    <div class="letters-grid" id="lettersGrid"></div>

</section>



<!-- ================= LETTER READER ================= -->

<section class="reader" id="reader">

    <button class="back" id="backButton">
        ← back to collection
    </button>

    <div class="paper">

        <p class="letter-number" id="letterNumber">
            LETTER 01
        </p>

        <h2 id="letterTitle">
            Before I Knew You
        </h2>

        <div id="letterContent"></div>

    </div>

    <div class="navigation">

        <button id="previousButton">
            ← Previous
        </button>

        <button id="nextButton">
            Next →
        </button>

    </div>

</section>
